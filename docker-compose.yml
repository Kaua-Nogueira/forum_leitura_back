services:
  postgres:
    image: postgres:16-alpine
    container_name: forum_leitura_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-forum_leitura}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema_postgresql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres_data:
